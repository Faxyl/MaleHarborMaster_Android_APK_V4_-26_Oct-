plugins {
    id 'com.android.application'
}

android {
    namespace 'mv.fazeel.maleharbormaster'
    compileSdk 34

    defaultConfig {
        applicationId "mv.fazeel.maleharbormaster"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure zero-dependency Android SDK WebView wrapper for fast APK compilation
}
